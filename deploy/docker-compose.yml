name: result-system

x-app-common: &app-common
  image: ${APP_IMAGE:-result-system-app:local}
  pull_policy: never
  restart: unless-stopped
  env_file:
    - ../backend/.env
  depends_on:
    mysql:
      condition: service_healthy

services:
  app:
    <<: *app-common
    build:
      context: ../backend
      dockerfile: Dockerfile
    environment:
      DB_HOST: mysql
      RUN_MIGRATIONS: "true"
    volumes:
      - app_storage:/var/www/html/storage
      - public_assets:/var/www/html/public
    healthcheck:
      test: ["CMD-SHELL", "php-fpm -t >/dev/null 2>&1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      # Bind to localhost because Apache is the public reverse proxy.
      # If you want Docker Nginx public directly, change this to "${HTTP_PORT:-8080}:80".
      - "127.0.0.1:${HTTP_PORT:-8080}:80"
    volumes:
      - public_assets:/var/www/html/public:ro
      - app_storage:/var/www/html/storage:ro
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      app:
        condition: service_healthy

  queue:
    <<: *app-common
    depends_on:
      app:
        condition: service_healthy
      mysql:
        condition: service_healthy
    environment:
      DB_HOST: mysql
      RUN_MIGRATIONS: "false"
    command:
      - php
      - artisan
      - queue:work
      - --sleep=2
      - --tries=3
      - --timeout=120
    volumes:
      - app_storage:/var/www/html/storage

  scheduler:
    <<: *app-common
    depends_on:
      app:
        condition: service_healthy
      mysql:
        condition: service_healthy
    environment:
      DB_HOST: mysql
      RUN_MIGRATIONS: "false"
    command: ["php", "artisan", "schedule:work"]
    volumes:
      - app_storage:/var/www/html/storage

  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-result_system}
      MYSQL_USER: ${DB_USERNAME:-result_user}
      MYSQL_PASSWORD: ${DB_PASSWORD:-change_me}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-change_root_me}
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test:
        - CMD-SHELL
        - mysqladmin ping -h 127.0.0.1 -uroot -p"$${MYSQL_ROOT_PASSWORD}" --silent
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 20s

volumes:
  mysql_data:
  app_storage:
  public_assets:
